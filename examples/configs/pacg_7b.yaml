data:
  train_files: ""
  val_files: ""
  prompt_key: problem
  answer_key: answer
  image_key: images
  max_prompt_length: 4096
  max_response_length: 2048
  rollout_batch_size: 384
  val_batch_size: 512
  format_prompt: examples/format_prompt/math_format_perception.jinja
  shuffle: true
  seed: 42
  max_pixels: 1003520
  min_pixels: 200704
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: true
  use_kl_loss: false
  kl_penalty: low_var_kl
  kl_coef: 0.0
  online_filtering: true
  filter_key: accuracy
  filter_low: 0.01
  filter_high: 0.99
  use_pa_grpo: true
  pa_margin: 0.05
  pa_alpha: 10.0
  pa_gate_floor: 0.30
  pa_residual_min_tokens: 8
  pa_counterfactual_provider: random_patch_blackening
  pa_annotator_script: pacg/annotation.py
  pa_annotator_url: http://127.0.0.1:8000/v1/chat/completions
  pa_annotator_model: annotator
  pa_annotator_trust_env: false
  pa_annotator_concurrency: 16
  pa_annotator_timeout: 120
  pa_annotator_request_budget: 360
  pa_annotation_batch_budget: 3600
  pa_max_annotation_failure_rate: 0.20
  use_entropy_penalty: true
  entropy_penalty_coef: 0.10

worker:
  actor:
    global_batch_size: 128
    micro_batch_size_per_device_for_update: 2
    micro_batch_size_per_device_for_experience: 4
    dynamic_batching: false
    loss_avg_mode: token
    clip_ratio_low: 0.20
    clip_ratio_high: 0.28
    max_grad_norm: 1.0
    padding_free: true
    ulysses_size: 1
    model:
      model_path: Qwen/Qwen2.5-VL-7B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: true
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
    fsdp:
      torch_dtype: bf16
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true
      offload_optimizer: true
  rollout:
    n: 8
    temperature: 1.0
    top_p: 0.99
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.60
    max_model_len: 6144
    max_num_batched_tokens: 6144
    limit_images: 10
    val_override_config:
      temperature: 1.0
      top_p: 1.0
      n: 8
  ref:
    fsdp:
      torch_dtype: bf16
      enable_full_shard: true
      enable_cpu_offload: true
      enable_rank0_init: true
  reward:
    reward_type: batch
    reward_function: pacg/reward.py:compute_score
    reward_function_kwargs:
      format_weight: 0.0

trainer:
  project_name: pacg
  experiment_name: dapo_pacg_7b
  total_epochs: 2
  max_steps: 200
  nnodes: 1
  n_gpus_per_node: 8
  val_before_train: true
  val_freq: 20
  save_freq: 20
  save_limit: 3
  logger: [console, file, tensorboard]

